# Hermes Agent Configuration - Singapore ECS (ap-southeast-3)
# This is a sanitized copy for the repository.
# Actual deployment config is at /root/.hermes/config.yaml on the Singapore ECS.

model:
  default: deepseek-v4-flash
  provider: custom
  base_url: https://api-ap-southeast-1.modelarts-maas.com/openai/v1
  fallback_models:
    - deepseek-v3.2
    - deepseek-v4-pro
    - deepseek-v3.1-terminus
    - DeepSeek-V3
    - glm-5.1

compression:
  enabled: true
  threshold: 0.85
  reserve_tokens_floor: 50000
  keep_recent_tokens: 10000

mcp_servers:
  huawei-cloud:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
      - /root/.hermes/skills/huawei-cloud-mcp/server.py
  filesystem:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /root/PulseProjects
      - /root/PulseExpends
  github:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"

gateway:
  port: 18790
